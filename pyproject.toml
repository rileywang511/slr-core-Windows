[project]
name = "slr-core"
version = "0.1.0"
description = "Reproducible PRISMA-compliant systematic literature review CLI (CSV-based core)"
requires-python = ">=3.11"
authors = [{ name = "Reuben Duncan", email = "reuben.duncan25@outlook.com" }]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rapidfuzz>=3.6",
    "rispy>=0.9",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
    "openai>=1.40",
]
marker = [
    "marker-pdf>=0.2",
]
pdf-inspector = [
    "pdf-inspector>=0.2",
]
anydoc = [
    "firecrawl-anydoc>=0.1",
]
all = [
    "anthropic>=0.40",
    "openai>=1.40",
    "marker-pdf>=0.2",
    "pdf-inspector>=0.2",
    "firecrawl-anydoc>=0.1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "ruff>=0.5",
]

[project.scripts]
slr = "slr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "slow: tests that hit external APIs or run heavy models",
]

[tool.ruff]
line-length = 100
target-version = "py311"
